<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de Documentos Jurídicos</title>
<style>
  :root{
    --tinta:#1a1f2b;
    --gris:#6b7280;
    --linea:#e2e5ea;
    --fondo:#f4f5f7;
    --acento:#7a1f2b;
    --acento-claro:#f3e9ea;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--fondo);
    color:var(--tinta);
  }
  header{
    background:var(--tinta);
    color:#fff;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header p{margin:2px 0 0;font-size:12px;color:#a8aebb}
  .acciones{display:flex;gap:8px;flex-wrap:wrap}
  button{
    font:inherit;font-size:13px;
    padding:9px 14px;
    border-radius:6px;
    border:1px solid transparent;
    cursor:pointer;
    background:#fff;color:var(--tinta);
    transition:opacity .15s;
  }
  button:hover{opacity:.85}
  button.principal{background:var(--acento);color:#fff}
  button.fantasma{background:transparent;color:#cfd4dd;border-color:#3a4152}

  .app{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 62px)}
  @media (max-width:900px){.app{grid-template-columns:1fr}}

  .panel{
    background:#fff;
    border-right:1px solid var(--linea);
    padding:20px;
    overflow-y:auto;
    max-height:calc(100vh - 62px);
  }
  @media (max-width:900px){.panel{max-height:none}}

  .grupo{margin-bottom:16px}
  label{display:block;font-size:12px;font-weight:600;color:var(--gris);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  input,select,textarea{
    width:100%;font:inherit;font-size:14px;
    padding:9px 11px;
    border:1px solid var(--linea);
    border-radius:6px;
    background:#fff;color:var(--tinta);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--acento-claro);border-color:var(--acento)}
  textarea{min-height:66px;resize:vertical}
  .ayuda{font-size:11px;color:var(--gris);margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400}

  .selector{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--linea)}
  .seccion{
    font-size:11px;font-weight:700;color:var(--acento);
    text-transform:uppercase;letter-spacing:.8px;
    margin:24px 0 12px;padding-bottom:6px;
    border-bottom:1px solid var(--linea);
  }
  .seccion:first-of-type{margin-top:0}

  .visor{padding:28px;overflow-y:auto;max-height:calc(100vh - 62px)}
  @media (max-width:900px){.visor{max-height:none;padding:16px}}

  #doc{
    background:#fff;
    max-width:800px;
    margin:0 auto;
    padding:70px 80px;
    box-shadow:0 1px 3px rgba(0,0,0,.10),0 8px 24px rgba(0,0,0,.06);
    font-family:"Times New Roman",Georgia,serif;
    font-size:15px;
    line-height:1.75;
    color:#000;
    text-align:justify;
  }
  @media (max-width:900px){#doc{padding:34px 26px}}

  #doc h2{text-align:center;font-size:16px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 26px;line-height:1.5}
  #doc h3{font-size:15px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.4px}
  #doc p{margin:0 0 13px}
  #doc .clausula{margin:0 0 13px}
  #doc .centro{text-align:center}
  #doc .der{text-align:right}
  #doc b{font-weight:bold}
  #doc .firmas{margin-top:56px;width:100%;border-collapse:collapse}
  #doc .firmas td{width:50%;text-align:center;vertical-align:top;padding:0 14px;font-size:14px}
  #doc .linea-firma{border-top:1px solid #000;margin-bottom:6px;padding-top:0}
  #doc .nota-pie{margin-top:40px;font-size:11px;color:#555;font-style:italic;border-top:1px solid #ccc;padding-top:10px;text-align:left}

  /* --- Títulos accionarios --- */
  #doc .orla{border:3px double #000;padding:34px 38px}
  #doc .marca{text-align:center;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#555;margin-bottom:14px}
  #doc .tbl-datos{width:100%;border-collapse:collapse;margin:0 0 24px;font-size:13.5px}
  #doc .tbl-datos td{border:1px solid #000;padding:6px 9px;vertical-align:top;text-align:left;width:50%}
  #doc .tbl-cifras{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:13.5px}
  #doc .tbl-cifras th,#doc .tbl-cifras td{border:1px solid #000;padding:5px 9px}
  #doc .tbl-cifras th{background:#f0f0f0;text-align:left;font-size:12.5px;text-transform:none;letter-spacing:0}
  #doc .tbl-cifras td:last-child{text-align:right}
  #doc .tbl-reverso{width:100%;border-collapse:collapse;margin:8px 0 22px;font-size:10.5px}
  #doc .tbl-reverso th,#doc .tbl-reverso td{border:1px solid #000;padding:5px 4px;text-align:center}
  #doc .tbl-reverso th{background:#f0f0f0;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px}
  #doc .tbl-reverso td{height:28px}
  #doc .tbl-cupones{width:100%;border-collapse:collapse;margin-top:10px;table-layout:fixed}
  #doc .tbl-cupones td{border:1px dashed #000;padding:9px 10px;font-size:10.5px;line-height:1.55;vertical-align:top;text-align:left;width:33.33%}
  #doc .cnum{font-weight:bold;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #000;padding-bottom:4px;margin-bottom:6px}
  #doc .corte{border-top:1px dashed #999;margin:36px 0 22px;text-align:center}
  #doc .corte span{position:relative;top:-9px;background:#fff;padding:0 12px;font-family:-apple-system,Segoe UI,sans-serif;font-size:10px;color:#777;text-transform:uppercase;letter-spacing:1.4px}
  #doc .variante{font-size:11.5px;color:#444;border-left:2px solid #999;padding:2px 0 2px 12px;margin:0 0 14px;font-style:italic}

  .aviso{
    background:var(--acento-claro);
    border-left:3px solid var(--acento);
    padding:11px 13px;
    font-size:12px;
    line-height:1.55;
    color:#5a2229;
    border-radius:0 4px 4px 0;
    margin-bottom:20px;
  }

  @media print{
    header,.panel,.visor{all:unset}
    body{background:#fff}
    .app{display:block}
    header,.panel{display:none !important}
    .visor{padding:0;max-height:none;overflow:visible}
    #doc{box-shadow:none;max-width:none;margin:0;padding:0;font-size:12pt}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Generador de Documentos Jurídicos</h1>
    <p>Captura una vez. Documento formateado, listo para firma.</p>
  </div>
  <div class="acciones">
    <button class="fantasma" onclick="limpiar()">Limpiar</button>
    <button onclick="window.print()">Imprimir / PDF</button>
    <button class="principal" onclick="descargarWord()">Descargar en Word</button>
  </div>
</header>

<div class="app">
  <div class="panel">
    <div class="aviso">
      <b>Aviso.</b> Esta herramienta agiliza la captura y el formato. El contenido debe ser
      revisado y adaptado a cada caso por un abogado con cédula profesional antes de firmarse.
    </div>

    <div class="selector">
      <label for="plantilla">Tipo de documento</label>
      <select id="plantilla" onchange="cambiarPlantilla(this.value)"></select>
    </div>

    <form id="formulario" autocomplete="off"></form>
  </div>

  <div class="visor">
    <div id="doc"></div>
  </div>
</div>

<script>
/* ============================================================
   UTILIDADES
   ============================================================ */

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];

function fechaLarga(iso){
  if(!iso) return '____ de __________ de ______';
  const [a,m,d] = iso.split('-').map(Number);
  if(!a || !m || !d) return '____ de __________ de ______';
  return `${d} de ${MESES[m-1]} de ${a}`;
}

function pesos(n){
  const v = Number(n);
  if(!isFinite(v) || n === '' || n === null) return '$________';
  return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(v);
}

function numero(n){
  const v = Number(n);
  if(!isFinite(v) || n === '' || n === null) return '______';
  return new Intl.NumberFormat('es-MX').format(v);
}

/* "5,000 (cinco mil)" */
function numeroConLetra(n){
  const v = Number(n);
  if(!isFinite(v) || n === '' || n === null) return '______ (____________)';
  return `${numero(v)} (${apocope(enteroALetras(Math.floor(Math.abs(v)))).toLowerCase()})`;
}

const UNIDADES = ['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ',
  'ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE',
  'VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS',
  'VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
const DECENAS  = ['','','VEINTE','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
const CENTENAS = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS',
  'SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];

function dosDigitos(n){
  if(n < 30) return UNIDADES[n];
  const d = Math.floor(n/10), u = n%10;
  return u === 0 ? DECENAS[d] : DECENAS[d] + ' Y ' + UNIDADES[u];
}

function tresDigitos(n){
  if(n === 0) return '';
  if(n === 100) return 'CIEN';
  const c = Math.floor(n/100), r = n%100;
  let t = c > 0 ? CENTENAS[c] : '';
  if(r > 0) t += (t ? ' ' : '') + dosDigitos(r);
  return t;
}

function apocope(t){
  // "VEINTIUNO MIL" -> "VEINTIÚN MIL";  "UNO MIL" -> "MIL"
  return t.replace(/VEINTIUNO$/,'VEINTIÚN').replace(/\bUNO$/,'UN');
}

function enteroALetras(n){
  if(n === 0) return 'CERO';
  let partes = [];
  const millones = Math.floor(n/1000000);
  const miles    = Math.floor((n%1000000)/1000);
  const resto    = n%1000;

  if(millones > 0){
    partes.push(millones === 1 ? 'UN MILLÓN' : apocope(tresDigitos(millones)) + ' MILLONES');
  }
  if(miles > 0){
    partes.push(miles === 1 ? 'MIL' : apocope(tresDigitos(miles)) + ' MIL');
  }
  if(resto > 0) partes.push(tresDigitos(resto));
  return partes.join(' ');
}

function pesosALetras(n){
  const v = Number(n);
  if(!isFinite(v) || n === '' || n === null) return '(______________________________ PESOS 00/100 M.N.)';
  const entero = Math.floor(Math.abs(v));
  const cent = Math.round((Math.abs(v) - entero) * 100);
  const letras = apocope(enteroALetras(entero));
  const moneda = entero === 1 ? 'PESO' : 'PESOS';
  // "UN MILLÓN DE PESOS" cuando la cantidad es exacta en millones.
  const conector = (entero >= 1000000 && entero % 1000000 === 0) ? 'DE ' : '';
  return `(${letras} ${conector}${moneda} ${String(cent).padStart(2,'0')}/100 M.N.)`;
}

function txt(v, ancho = 30){
  const s = (v ?? '').toString().trim();
  return s ? s : '_'.repeat(ancho);
}

function mayus(v, ancho = 30){
  const s = (v ?? '').toString().trim();
  return s ? s.toUpperCase() : '_'.repeat(ancho);
}

function ordinal(n){
  const o = ['','PRIMERA','SEGUNDA','TERCERA','CUARTA','QUINTA','SEXTA','SÉPTIMA','OCTAVA',
    'NOVENA','DÉCIMA','DÉCIMA PRIMERA','DÉCIMA SEGUNDA','DÉCIMA TERCERA','DÉCIMA CUARTA',
    'DÉCIMA QUINTA','DÉCIMA SEXTA'];
  return o[n] || n + 'ª';
}

/* ============================================================
   PLANTILLAS
   ============================================================ */

const HOY = new Date().toISOString().slice(0,10);
const CIUDAD_DEF = 'Ciudad Nezahualcóyotl, Estado de México';

const PLANTILLAS = {

/* ---------- 1. CONTRATO DE ARRENDAMIENTO ---------- */
arrendamiento: {
  nombre: 'Contrato de arrendamiento',
  campos: [
    {s:'Datos generales'},
    {id:'ciudad', et:'Lugar de celebración', v:CIUDAD_DEF},
    {id:'fecha', et:'Fecha de firma', tipo:'date', v:HOY},

    {s:'Arrendador (quien renta)'},
    {id:'arrendador', et:'Nombre completo'},
    {id:'arrendadorDom', et:'Domicilio para oír y recibir notificaciones', tipo:'textarea'},

    {s:'Arrendatario (inquilino)'},
    {id:'arrendatario', et:'Nombre completo'},
    {id:'arrendatarioDom', et:'Domicilio para oír y recibir notificaciones', tipo:'textarea'},

    {s:'Inmueble'},
    {id:'tipo', et:'Tipo de inmueble', tipo:'select',
      opciones:['casa habitación','departamento','cuarto','local comercial','bodega','terreno'], v:'casa habitación'},
    {id:'domicilio', et:'Ubicación exacta del inmueble', tipo:'textarea',
      ayuda:'Calle, número, colonia, municipio y código postal.'},
    {id:'destino', et:'Destino o uso convenido', v:'casa habitación'},

    {s:'Vigencia y renta'},
    {id:'inicio', et:'Inicio del arrendamiento', tipo:'date', v:HOY},
    {id:'meses', et:'Duración en meses', tipo:'number', v:'12'},
    {id:'renta', et:'Renta mensual (pesos)', tipo:'number'},
    {id:'dia', et:'Día de pago de cada mes', tipo:'number', v:'5'},
    {id:'formaPago', et:'Forma de pago', tipo:'select',
      opciones:['en efectivo contra entrega de recibo','mediante transferencia electrónica','en efectivo o transferencia'],
      v:'en efectivo contra entrega de recibo'},
    {id:'deposito', et:'Depósito en garantía (pesos)', tipo:'number',
      ayuda:'Normalmente equivale a uno o dos meses de renta.'},
    {id:'servicios', et:'Servicios a cargo del arrendatario',
      v:'agua, energía eléctrica, gas, internet y telefonía'},

    {s:'Obligado solidario (opcional)'},
    {id:'fiador', et:'Nombre del obligado solidario', ayuda:'Deja en blanco si no habrá fiador.'},
    {id:'fiadorDom', et:'Domicilio del obligado solidario'}
  ],
  generar(d){
    const R = Number(d.renta) || 0;
    let n = 0;
    const c = () => ordinal(++n);
    const fiador = (d.fiador||'').trim();

    return `
      <h2>Contrato de Arrendamiento</h2>

      <p>En ${txt(d.ciudad,25)}, a ${fechaLarga(d.fecha)}, comparecen por una parte
      <b>${mayus(d.arrendador)}</b>, a quien en lo sucesivo se le denominará <b>&ldquo;EL ARRENDADOR&rdquo;</b>,
      y por la otra parte <b>${mayus(d.arrendatario)}</b>, a quien en lo sucesivo se le denominará
      <b>&ldquo;EL ARRENDATARIO&rdquo;</b>${fiador ? `, y con la comparecencia de <b>${mayus(fiador)}</b>, en su calidad de <b>&ldquo;OBLIGADO SOLIDARIO&rdquo;</b>` : ''};
      quienes manifiestan su voluntad de celebrar el presente contrato de arrendamiento, al tenor de las
      siguientes declaraciones y cláusulas.</p>

      <h3>Declaraciones</h3>

      <p><b>I.</b> Declara <b>EL ARRENDADOR</b> ser una persona física con plena capacidad jurídica para
      contratar y obligarse; que señala como domicilio para oír y recibir notificaciones el ubicado en
      ${txt(d.arrendadorDom,45)}; y que se encuentra legítimamente facultado para otorgar en arrendamiento
      el inmueble objeto de este contrato, encontrándose éste libre de gravamen y al corriente en el pago
      de sus contribuciones.</p>

      <p><b>II.</b> Declara <b>EL ARRENDATARIO</b> ser una persona física con plena capacidad jurídica para
      contratar y obligarse; que señala como domicilio para oír y recibir notificaciones el ubicado en
      ${txt(d.arrendatarioDom,45)}; que conoce el estado físico del inmueble, el cual recibe a su entera
      satisfacción; y que cuenta con los recursos suficientes para cumplir las obligaciones que aquí asume.</p>

      ${fiador ? `<p><b>III.</b> Declara el <b>OBLIGADO SOLIDARIO</b> ser persona física con capacidad
      jurídica para contratar y obligarse, con domicilio en ${txt(d.fiadorDom,40)}, y comparecer a la
      firma de este contrato con el fin de garantizar solidariamente el cumplimiento de todas y cada una
      de las obligaciones de <b>EL ARRENDATARIO</b>.</p>` : ''}

      <p><b>${fiador ? 'IV' : 'III'}.</b> Declaran ambas partes que no existe error, dolo, mala fe, violencia
      ni lesión alguna que pudiera viciar su consentimiento, por lo que se someten a las siguientes:</p>

      <h3>Cláusulas</h3>

      <p class="clausula"><b>${c()}. OBJETO.</b> <b>EL ARRENDADOR</b> otorga en arrendamiento a
      <b>EL ARRENDATARIO</b> el ${txt(d.tipo,12)} ubicado en ${txt(d.domicilio,45)}, con todas sus
      instalaciones, accesorios y servicios, mismo que <b>EL ARRENDATARIO</b> recibe en buen estado de
      conservación y funcionamiento.</p>

      <p class="clausula"><b>${c()}. DESTINO.</b> El inmueble arrendado será destinado única y exclusivamente
      para ${txt(d.destino,18)}. <b>EL ARRENDATARIO</b> no podrá variar dicho destino sin el consentimiento
      previo y por escrito de <b>EL ARRENDADOR</b>, siendo su incumplimiento causa de rescisión.</p>

      <p class="clausula"><b>${c()}. VIGENCIA.</b> Las partes convienen en que la vigencia del presente
      contrato será de ${txt(d.meses,3)} (${d.meses ? enteroALetras(Number(d.meses)).toLowerCase() : '________'})
      meses forzosos para ambas partes, contados a partir del ${fechaLarga(d.inicio)}. Concluido dicho plazo,
      el contrato podrá prorrogarse únicamente mediante convenio escrito firmado por ambas partes.</p>

      <p class="clausula"><b>${c()}. RENTA.</b> <b>EL ARRENDATARIO</b> se obliga a pagar a
      <b>EL ARRENDADOR</b> por concepto de renta mensual la cantidad de <b>${pesos(d.renta)}</b>
      ${pesosALetras(d.renta)}, cantidad que no incluye los servicios señalados en la cláusula
      correspondiente.</p>

      <p class="clausula"><b>${c()}. FORMA Y LUGAR DE PAGO.</b> La renta será cubierta por mensualidades
      adelantadas, a más tardar el día ${txt(d.dia,2)} de cada mes, ${txt(d.formaPago,20)}. El pago se
      realizará en el domicilio de <b>EL ARRENDADOR</b> o en el lugar que éste designe por escrito. La falta
      de pago oportuno de una sola mensualidad faculta a <b>EL ARRENDADOR</b> para exigir el cumplimiento
      forzoso o la rescisión del contrato, con el pago de los daños y perjuicios correspondientes.</p>

      <p class="clausula"><b>${c()}. DEPÓSITO EN GARANTÍA.</b> A la firma del presente contrato,
      <b>EL ARRENDATARIO</b> entrega a <b>EL ARRENDADOR</b> la cantidad de <b>${pesos(d.deposito)}</b>
      ${pesosALetras(d.deposito)} por concepto de depósito en garantía, la cual será devuelta dentro de los
      quince días naturales siguientes a la desocupación y entrega del inmueble, previa deducción del importe
      de los daños que en su caso presente el inmueble y de los adeudos por servicios. Las partes convienen
      expresamente que dicho depósito <b>no podrá aplicarse al pago de rentas</b>.</p>

      <p class="clausula"><b>${c()}. SERVICIOS.</b> Serán a cargo exclusivo de <b>EL ARRENDATARIO</b> el pago
      puntual de los siguientes servicios: ${txt(d.servicios,35)}. <b>EL ARRENDATARIO</b> se obliga a exhibir
      los comprobantes de pago cuando <b>EL ARRENDADOR</b> se lo solicite, y a entregar el inmueble al
      término del contrato sin adeudo alguno por estos conceptos.</p>

      <p class="clausula"><b>${c()}. CONSERVACIÓN Y REPARACIONES.</b> <b>EL ARRENDATARIO</b> se obliga a
      conservar el inmueble en el mismo estado en que lo recibió, siendo a su cargo las reparaciones que se
      originen por el uso normal o por su culpa o negligencia. Las reparaciones mayores derivadas de vicios
      ocultos o de la estructura del inmueble serán a cargo de <b>EL ARRENDADOR</b>.</p>

      <p class="clausula"><b>${c()}. MEJORAS.</b> <b>EL ARRENDATARIO</b> no podrá realizar modificaciones,
      adaptaciones ni mejoras al inmueble sin autorización previa y por escrito de <b>EL ARRENDADOR</b>. Las
      mejoras que se autoricen quedarán en beneficio del inmueble sin derecho a reembolso ni compensación
      alguna, salvo pacto escrito en contrario.</p>

      <p class="clausula"><b>${c()}. PROHIBICIÓN DE SUBARRENDAR.</b> Queda expresamente prohibido a
      <b>EL ARRENDATARIO</b> subarrendar, ceder, traspasar o gravar total o parcialmente los derechos
      derivados de este contrato, así como permitir el uso del inmueble a terceros, sin consentimiento
      previo y por escrito de <b>EL ARRENDADOR</b>.</p>

      <p class="clausula"><b>${c()}. RESCISIÓN.</b> Será causa de rescisión, sin necesidad de declaración
      judicial previa y sin responsabilidad para <b>EL ARRENDADOR</b>: a) la falta de pago oportuno de una o
      más mensualidades de renta; b) el uso del inmueble para un destino distinto al convenido; c) el
      subarrendamiento o cesión no autorizados; d) los daños causados al inmueble por culpa o negligencia de
      <b>EL ARRENDATARIO</b>; e) el uso del inmueble para actividades ilícitas; y f) el incumplimiento de
      cualquiera de las obligaciones aquí pactadas.</p>

      <p class="clausula"><b>${c()}. DEVOLUCIÓN DEL INMUEBLE.</b> Al término de la vigencia o en caso de
      rescisión, <b>EL ARRENDATARIO</b> se obliga a devolver el inmueble desocupado, en buen estado y con

      ? `<p class="clausula"><b>${c()}. CAPITAL SOCIAL.</b> Las acciones que ampara el presente

         del capital social. El capital social se encuentra dividido en ${numeroConLetra(d.totalAcciones)}
         acciones.</p>`

         ${pesos(vn)} ${pesosALetras(vn)} cada una, conforme al siguiente detalle:</p>
         ${filasCapital}
         <p class="variante">Al integrarse el capital social mediante diversas series de acciones, las
         menciones relativas al importe del capital y al número de acciones se concretan, en cada emisión, a
         los totales que se alcancen con cada una de dichas series, en términos del párrafo segundo de la
         fracción IV del artículo 125 de la Ley General de Sociedades Mercantiles.</p>`;

    /* ---- Fracción V: exhibiciones ---- */
    const clausulaExhibiciones = () => liberadas
      ? `<p class="clausula"><b>${c()}. EXHIBICIONES PAGADAS.</b> Las acciones que ampara este
         ${provisional ? 'certificado' : 'título'} se encuentran <b>íntegramente pagadas y liberadas</b>, al
         haberse cubierto el cien por ciento de su valor${sinVN ? '' : ` nominal, esto es, la cantidad de ${pesos(valorTitulo)} ${pesosALetras(valorTitulo)}`},
         mediante aportación ${txt(d.aportacion,12)}, según consta en el acta de la asamblea general de
         accionistas de fecha ${fechaLarga(d.fechaAsamblea)} y en la contabilidad social.</p>`
      : `<p class="clausula"><b>${c()}. EXHIBICIONES PAGADAS.</b> Sobre el valor de cada una de las acciones
         que ampara este ${provisional ? 'certificado' : 'título'}, el accionista ha exhibido la cantidad de
         <b>${pesos(exhibido)}</b> ${pesosALetras(exhibido)}, equivalente al <b>${pct}%</b> de su valor
         nominal, mediante aportación ${txt(d.aportacion,12)}, quedando pendiente de exhibir la cantidad de
         <b>${pesos(pendiente)}</b> ${pesosALetras(pendiente)} por acción, pagadera en los términos, montos y
         plazos que fije la asamblea general de accionistas o el consejo de administración, con las
         consecuencias previstas en los artículos 118 a 121 de la Ley General de Sociedades Mercantiles en
         caso de mora.</p>`;

    /* ---- Fracción VII: derechos ---- */
    const derechoVoto = votoPleno
      ? `<b>Derecho de voto pleno</b>, con derecho a ${txt(d.votos,1)} voto por cada acción en las asambleas
         generales ordinarias y extraordinarias de accionistas, en términos de los artículos 113 y 189 de la
         Ley General de Sociedades Mercantiles.`
      : `<b>Derecho de voto en los términos propios de su clase</b> (${txt(d.tipoAccion,20)}), con
         ${txt(d.votos,1)} voto por acción exclusivamente en los asuntos que la ley y los estatutos sociales
         reservan a esta clase de acciones, conforme al artículo 113 de la Ley General de Sociedades
         Mercantiles.`;

    const leyendaExtranjeros = d.clausulaExt === 'Exclusión de extranjeros'
      ? `<b>Cláusula de exclusión de extranjeros.</b> Conforme a la cláusula ____ de los estatutos sociales,
         ningún extranjero podrá ser socio o accionista de la sociedad; si por cualquier evento alguna acción
         llegare a ser adquirida por un extranjero, dicha adquisición será nula y, en consecuencia, quedará
         cancelada la acción de que se trate.`
      : d.clausulaExt === 'Admisión de extranjeros (cláusula Calvo)'
      ? `<b>Cláusula de admisión de extranjeros.</b> Todo extranjero que en el acto de la constitución o en
         cualquier tiempo ulterior adquiera un interés o participación social en la sociedad se considerará,
         por ese simple hecho, como mexicano respecto de uno y otra, y se entenderá que conviene en no
         invocar la protección de su gobierno, bajo la pena, en caso de faltar a su convenio, de perder dicho
         interés o participación en beneficio de la Nación Mexicana.`
      : '';

    /* ---- Reverso ---- */
    const filaVacia = (cols) => '<tr>' + '<td></td>'.repeat(cols) + '</tr>';
    const reverso = d.incluirReverso === 'No' ? '' : `
      <div class="corte"><span>Reverso del ${provisional ? 'certificado' : 'título'}</span></div>

      <h3>A) Endosos y transmisiones (arts. 129 y 131 LGSM)</h3>
      <table class="tbl-reverso">
        <tr>
          <th>No.</th><th>Fecha</th><th>Endosante</th><th>Endosatario</th><th>Acciones</th>
          ${restringida ? '<th>Autorización del consejo</th>' : ''}
          <th>Registro de acciones</th><th>Firma del secretario</th>
        </tr>
        ${filaVacia(restringida ? 8 : 7).repeat(4)}
      </table>

      <h3>B) Exhibiciones posteriores (art. 125, fracc. V)</h3>
      <table class="tbl-reverso">
        <tr><th>Fecha</th><th>Importe exhibido</th><th>% acumulado pagado</th><th>Recibo o póliza</th><th>Firma autorizada</th></tr>
        ${filaVacia(5).repeat(3)}
      </table>

      <h3>C) Gravámenes, prenda o usufructo</h3>
      <table class="tbl-reverso">
        <tr><th>Fecha</th><th>Tipo de gravamen</th><th>Acreedor o beneficiario</th><th>Documento base</th><th>Firma autorizada</th></tr>
        ${filaVacia(5).repeat(2)}
      </table>

      <h3>D) Leyenda de cancelación</h3>
      <p style="font-size:13px">Cancelado por ______________________ (canje, reducción de capital,
      amortización o reposición), según acuerdo de la asamblea general de accionistas de fecha
      ______________________. Se expide en sustitución el ${provisional ? 'certificado' : 'título'} número
      ____________.</p>`;

    /* ---- Cupones (art. 126 LGSM) ---- */
    const nCup = Math.max(0, Math.min(24, Number(d.numCupones) || 0));
    let cupones = '';
    if(nCup > 0 && !provisional){
      const celdas = [];
      for(let i = 1; i <= nCup; i++){
        celdas.push(`<td>
          <div class="cnum">Cupón No. ${i}</div>
          <b>${mayus(d.denominacion,16)}</b><br>
          Título No. ${txt(d.numTitulo,5)} &middot; Serie &ldquo;${txt(d.serie,1)}&rdquo;<br>
          Acciones amparadas: ${numero(d.numAcciones)}<br><br>
          Ejercicio social: ____________<br>
          Dividendo por acción: $__________<br>
          Importe total: $______________<br>
          Asamblea de fecha: ____________<br><br>
          Pagadero contra entrega de este cupón en el domicilio social.<br><br>
          Firma: ________________
        </td>`);
      }
      while(celdas.length % 3 !== 0) celdas.push('<td style="border:none"></td>');
      let filas = '';
      for(let i = 0; i < celdas.length; i += 3) filas += '<tr>' + celdas.slice(i, i+3).join('') + '</tr>';
      cupones = `
        <div class="corte"><span>Cupones adheridos &middot; art. 126 LGSM</span></div>
        <p style="font-size:13px">Los presentes cupones se desprenden del título y se entregan a la sociedad
        contra el pago de los dividendos o intereses correspondientes, en términos del artículo 126 de la Ley
        General de Sociedades Mercantiles.</p>
        <table class="tbl-cupones">${filas}</table>`;
    }

    /* ---- Anexo académico ---- */
    const anexo = d.anexoLegal === 'No' ? '' : `
      <div class="corte"><span>Anexo &middot; fundamento legal</span></div>
      <h3>Requisitos del artículo 125 LGSM</h3>
      <table class="tbl-cifras">
        <tr><th style="width:52px">Fracc.</th><th>Requisito legal</th><th style="width:150px">Ubicación</th></tr>
        <tr><td>I</td><td>Nombre, nacionalidad y domicilio del accionista</td><td>Cláusula primera</td></tr>
        <tr><td>II</td><td>Denominación, domicilio y duración de la sociedad</td><td>Encabezado y cláusula segunda</td></tr>
        <tr><td>III</td><td>Fecha de constitución y datos de inscripción en el Registro Público de Comercio</td><td>Cláusula tercera</td></tr>
        <tr><td>IV</td><td>Importe del capital social, número total y valor nominal de las acciones</td><td>Cláusula cuarta</td></tr>
        <tr><td>V</td><td>Exhibiciones pagadas o indicación de ser liberada</td><td>Cláusula quinta</td></tr>
        <tr><td>VI</td><td>Serie y número de la acción, con el total de acciones de la serie</td><td>Cláusula sexta y encabezado</td></tr>
        <tr><td>VII</td><td>Derechos concedidos y obligaciones impuestas; limitaciones al voto, a las utilidades y al haber social</td><td>Cláusula séptima</td></tr>
        <tr><td>VIII</td><td>Firma autógrafa de los administradores, o facsímil con depósito del original en el RPC</td><td>Sección de firmas</td></tr>
      </table>
      <p style="font-size:13px">Preceptos complementarios: artículo 111 (naturaleza del título y aplicación
      supletoria de las reglas de los títulos de crédito), 112 (igualdad de valor y derechos), 113 (voto
      limitado), 124 (un título puede amparar una o varias acciones), 126 (cupones), 128 y 129 (registro de
      acciones y legitimación del accionista), 130 (autorización del consejo para la transmisión) y 131
      (transmisión por endoso e inscripción en el registro), todos de la Ley General de Sociedades
      Mercantiles.</p>`;

    /* ---- Documento ---- */
    return `
      <div class="orla">
        <div class="marca">${mayus(d.denominacion,20)}</div>

        <h2 style="margin-bottom:8px">${txt(d.clase,20)}</h2>
        <p class="centro" style="font-size:12.5px;margin-bottom:22px">
          Sociedad mercantil constituida conforme a las leyes de los Estados Unidos Mexicanos<br>
          Título nominativo expedido en términos de los artículos 111, 124 y 125 de la Ley General de
          Sociedades Mercantiles
        </p>

        <table class="tbl-datos">
          <tr>
            <td><b>${provisional ? 'Certificado' : 'Título'} número:</b> ${txt(d.numTitulo,8)}</td>
            <td><b>Serie:</b> &ldquo;${txt(d.serie,3)}&rdquo;</td>
          </tr>
          <tr>
            <td><b>Acciones que ampara:</b> ${numeroConLetra(d.numAcciones)}</td>
            <td><b>Valor nominal unitario:</b> ${sinVN ? 'sin expresión de valor nominal' : pesos(vn)}</td>
          </tr>
          <tr>
            <td><b>Valor total del ${provisional ? 'certificado' : 'título'}:</b> ${sinVN ? 'no aplicable' : pesos(valorTitulo)}</td>
            <td><b>Lugar y fecha de expedición:</b> ${txt(d.ciudad,20)}, a ${fechaLarga(d.fecha)}</td>
          </tr>
        </table>

        <p class="clausula"><b>${c()}. TITULAR DE LAS ACCIONES.</b> El presente
        ${provisional ? 'certificado provisional' : 'título'} se expide a favor del accionista
        <b>${mayus(d.accionista)}</b>, de nacionalidad ${txt(d.nacionalidad,10)}, con domicilio en
        ${txt(d.domAccionista,45)}, quien queda inscrito con tal calidad en el Registro de Acciones de la
        sociedad previsto en el artículo 128 de la Ley General de Sociedades Mercantiles.</p>

        <p class="clausula"><b>${c()}. SOCIEDAD EMISORA.</b> La sociedad emisora se denomina
        <b>${mayus(d.denominacion,20)}</b>, tiene su domicilio social en ${txt(d.domSocial,20)}, Estados
        Unidos Mexicanos, y su duración es de ${duracionTxt}.</p>

        <p class="clausula"><b>${c()}. CONSTITUCIÓN E INSCRIPCIÓN.</b> La sociedad se constituyó mediante
        escritura pública número ${txt(d.escritura,8)}, de fecha ${fechaLarga(d.fechaConst)}, otorgada ante
        la fe del licenciado ${txt(d.notario,25)}, Notario Público número ${txt(d.numNotario,4)} de
        ${txt(d.plazaNotario,20)}, cuyo primer testimonio quedó inscrito en el <b>Registro Público de
        Comercio</b> de dicha plaza bajo el folio mercantil electrónico número ${txt(d.folioMercantil,14)},
        con fecha ${fechaLarga(d.fechaInscripcion)}.</p>

        ${clausulaCapital()}

        ${clausulaExhibiciones()}

        <p class="clausula"><b>${c()}. SERIE Y NUMERACIÓN.</b> Las acciones amparadas por este
        ${provisional ? 'certificado' : 'título'} pertenecen a la <b>Serie &ldquo;${txt(d.serie,3)}&rdquo;</b>,
        representativa de ${txt(d.porcionCapital,25)}, y están numeradas de la ${txt(d.accDesde,6)} a la
        ${txt(d.accHasta,6)}, ambas inclusive. La referida serie se integra por un total de
        ${numeroConLetra(d.accionesSerie)} acciones.</p>

        <p class="clausula"><b>${c()}. DERECHOS Y OBLIGACIONES DEL TENEDOR.</b> Las acciones amparadas por
        este ${provisional ? 'certificado' : 'título'} son <b>${txt(d.tipoAccion,20).toLowerCase()}</b> y
        confieren a su legítimo tenedor los derechos y le imponen las obligaciones que a continuación se
        expresan.</p>

        <p class="clausula"><b>A) Derechos.</b></p>
        <p class="clausula" style="padding-left:22px"><b>1.</b> ${derechoVoto}</p>
        <p class="clausula" style="padding-left:22px"><b>2.</b> <b>Derecho al dividendo</b>, en proporción a
        la participación que estas acciones representan en el capital social, previa aprobación de los estados
        financieros por la asamblea general de accionistas y previa separación de la reserva legal, en
        términos de los artículos 19 y 20 de la Ley General de Sociedades Mercantiles.</p>
        <p class="clausula" style="padding-left:22px"><b>3.</b> <b>Derecho de preferencia</b> para suscribir
        las acciones que se emitan con motivo de aumentos del capital social, en proporción a su tenencia y
        dentro del plazo previsto por el artículo 132 de la Ley General de Sociedades Mercantiles.</p>
        <p class="clausula" style="padding-left:22px"><b>4.</b> <b>Derecho a la cuota de liquidación</b> sobre
        el haber social, en proporción a su participación, conforme a los artículos 234 a 248 de la Ley
        General de Sociedades Mercantiles.</p>
        <p class="clausula" style="padding-left:22px"><b>5.</b> <b>Derechos de minoría</b>, en los términos y
        porcentajes previstos por los artículos 163, 181, 199 y 201 de la Ley General de Sociedades
        Mercantiles.</p>
        <p class="clausula" style="padding-left:22px"><b>6.</b> <b>Derecho de información</b> respecto de los
        estados financieros y de sus anexos, dentro del plazo señalado por el artículo 173 de la Ley General
        de Sociedades Mercantiles.</p>

        <p class="clausula"><b>B) Obligaciones y limitaciones.</b></p>
        <p class="clausula" style="padding-left:22px"><b>1.</b> ${liberadas
          ? 'Sujetarse a los estatutos sociales y a los acuerdos legalmente adoptados por las asambleas de accionistas y por el consejo de administración.'
          : 'Cubrir oportunamente las exhibiciones pendientes señaladas en la cláusula correspondiente, con las consecuencias previstas en los artículos 118 a 121 de la Ley General de Sociedades Mercantiles, así como sujetarse a los estatutos sociales y a los acuerdos legalmente adoptados por los órganos sociales.'}</p>
        ${limitaciones ? `<p class="clausula" style="padding-left:22px"><b>2.</b> <b>Limitaciones al derecho
        de voto, a la participación en las utilidades o en el haber social:</b> ${txt(limitaciones,45)}</p>` : ''}
        <p class="clausula" style="padding-left:22px"><b>${limitaciones ? 3 : 2}.</b> ${restringida
          ? `<b>Restricción a la transmisión.</b> Conforme a la cláusula ____ de los estatutos sociales y al artículo 130 de la Ley General de Sociedades Mercantiles, la transmisión de estas acciones sólo podrá efectuarse con la autorización previa y por escrito del consejo de administración, el cual podrá negarla designando comprador de las acciones al precio corriente en el mercado.`
          : `<b>Transmisibilidad.</b> Estas acciones son libremente transmisibles mediante endoso, sin necesidad de autorización de órgano social alguno, sin perjuicio de la obligación de inscribir la transmisión en el Registro de Acciones.`}</p>
        ${d.derechoTanto === 'Sí' ? `<p class="clausula" style="padding-left:22px"><b>${limitaciones ? 4 : 3}.</b>
        <b>Derecho del tanto.</b> Previamente a cualquier enajenación a favor de terceros, el accionista
        deberá ofrecer las acciones a los demás accionistas de la sociedad, en los términos y plazos
        establecidos en la cláusula ____ de los estatutos sociales.</p>` : ''}
        ${leyendaExtranjeros ? `<p class="clausula" style="padding-left:22px">
        <b>${(limitaciones ? 4 : 3) + (d.derechoTanto === 'Sí' ? 1 : 0)}.</b> ${leyendaExtranjeros}</p>` : ''}
        <p class="clausula" style="padding-left:22px">
        <b>${(limitaciones ? 4 : 3) + (d.derechoTanto === 'Sí' ? 1 : 0) + (leyendaExtranjeros ? 1 : 0)}.</b>
        <b>Legitimación.</b> La sociedad reputará como dueño de estas acciones únicamente a quien aparezca
        inscrito como tal en el Registro de Acciones, en términos de los artículos 128 y 129 de la Ley General
        de Sociedades Mercantiles. Toda transmisión deberá anotarse en dicho registro para surtir efectos
        frente a la sociedad, conforme al artículo 131 del mismo ordenamiento.</p>

        ${provisional ? `<p class="clausula"><b>${c()}. CANJE POR TÍTULO DEFINITIVO.</b> El presente
        certificado provisional será canjeado por el título definitivo de acciones que corresponda, dentro del
        plazo de ____________, contra su devolución y cancelación. Mientras subsista, acredita la calidad de
        accionista y los derechos aquí consignados.</p>` : ''}

        <p class="clausula"><b>${c()}. LEGISLACIÓN Y JURISDICCIÓN APLICABLES.</b> El presente
        ${provisional ? 'certificado' : 'título'} se rige por la Ley General de Sociedades Mercantiles y, en
        lo que resulte compatible, por la Ley General de Títulos y Operaciones de Crédito. Para la
        interpretación y cumplimiento de los derechos y obligaciones aquí consignados, las partes se someten a
        la jurisdicción de los tribunales competentes de ${txt(d.domSocial,20)}, con renuncia expresa a
        cualquier otro fuero que por razón de domicilio presente o futuro pudiera corresponderles.</p>

        <p style="margin-top:24px">Se expide el presente ${provisional ? 'certificado provisional' : 'título'}
        en ${txt(d.ciudad,20)}, a ${fechaLarga(d.fecha)}, suscrito por los administradores facultados
        conforme a la cláusula ____ de los estatutos sociales.</p>

        <table class="firmas">
          <tr>
            <td>
              <div class="linea-firma"></div>
              <b>${mayus(d.firmante1)}</b><br>${txt(d.cargo1,24)}
            </td>
            <td>
              <div class="linea-firma"></div>
              <b>${mayus(d.firmante2)}</b><br>${txt(d.cargo2,24)}
            </td>
          </tr>
        </table>

        <p class="variante" style="margin-top:26px">${d.tipoFirma === 'Autógrafa'
          ? 'Las firmas que anteceden son autógrafas, en términos de la fracción VIII del artículo 125 de la Ley General de Sociedades Mercantiles.'
          : 'Las firmas que anteceden se estampan impresas en facsímil, habiéndose depositado el original de las firmas respectivas en el Registro Público de Comercio en que se encuentra inscrita la sociedad, conforme a la fracción VIII del artículo 125 de la Ley General de Sociedades Mercantiles.'}</p>
      </div>

      ${reverso}

      ${cupones}

      ${anexo}

      <p class="nota-pie">Documento generado con formato automatizado. El contenido debe cotejarse con los
      estatutos sociales vigentes, con el libro de registro de acciones y con las actas de asamblea
      correspondientes, y ser revisado por un abogado con cédula profesional antes de su expedición y firma.</p>
    `;
  }
}

};

/* ============================================================
   INTERFAZ
   ============================================================ */

let actual = 'arrendamiento';

function initSelector(){
  const sel = document.getElementById('plantilla');
  sel.innerHTML = Object.entries(PLANTILLAS)
    .map(([k,p]) => `<option value="${k}">${p.nombre}</option>`).join('');
}

function claveGuardado(k){ return 'gendoc:' + k; }

function cambiarPlantilla(k){
  actual = k;
  const p = PLANTILLAS[k];
  const guardado = JSON.parse(localStorage.getItem(claveGuardado(k)) || '{}');
  const form = document.getElementById('formulario');

  form.innerHTML = p.campos.map(c => {
    if(c.s) return `<div class="seccion">${c.s}</div>`;

    const val = guardado[c.id] !== undefined ? guardado[c.id] : (c.v || '');
    const ayuda = c.ayuda ? `<div class="ayuda">${c.ayuda}</div>` : '';
    let control;

    if(c.tipo === 'textarea'){
      control = `<textarea id="${c.id}" oninput="render()">${val}</textarea>`;
    } else if(c.tipo === 'select'){
      control = `<select id="${c.id}" onchange="render()">` +
        c.opciones.map(o => `<option${o === val ? ' selected' : ''}>${o}</option>`).join('') +
        `</select>`;
    } else {
      control = `<input type="${c.tipo || 'text'}" id="${c.id}" value="${String(val).replace(/"/g,'&quot;')}" oninput="render()">`;
    }

    return `<div class="grupo"><label for="${c.id}">${c.et}</label>${control}${ayuda}</div>`;
  }).join('');

  render();
}

function datos(){
  const d = {};
  PLANTILLAS[actual].campos.forEach(c => {
    if(!c.id) return;
    const el = document.getElementById(c.id);
    if(el) d[c.id] = el.value;
  });
  return d;
}

function render(){
  const d = datos();
  localStorage.setItem(claveGuardado(actual), JSON.stringify(d));
  document.getElementById('doc').innerHTML = PLANTILLAS[actual].generar(d);
}

function limpiar(){
  if(!confirm('¿Borrar todos los datos capturados de este documento?')) return;
  localStorage.removeItem(claveGuardado(actual));
  cambiarPlantilla(actual);
}

function descargarWord(){
  const cuerpo = document.getElementById('doc').innerHTML;
  const html =
    `<html xmlns:o="urn:schemas-microsoft-com:office:office" ` +
    `xmlns:w="urn:schemas-microsoft-com:office:word" ` +
    `xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">` +
    `<title>${PLANTILLAS[actual].nombre}</title>` +
    `<style>@page{size:21.59cm 27.94cm;margin:2.5cm 3cm}` +
    `body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.7;text-align:justify}` +
    `h2{text-align:center;font-size:13pt;text-transform:uppercase}` +
    `h3{font-size:12pt;text-transform:uppercase}` +
    `table{width:100%}td{vertical-align:top}` +
    `.firmas td{width:50%;text-align:center;padding:0 12px}` +
    `.linea-firma{border-top:1px solid #000;margin-bottom:6px}` +
    `.centro{text-align:center}.der{text-align:right}` +
    `.orla{border:3px double #000;padding:24pt 26pt}` +
    `.marca{text-align:center;font-size:10pt;letter-spacing:2pt;color:#555;margin-bottom:10pt}` +
    `.tbl-datos{border-collapse:collapse;margin-bottom:16pt;font-size:10.5pt}` +
    `.tbl-datos td{border:1px solid #000;padding:4pt 6pt;width:50%}` +
    `.tbl-cifras{border-collapse:collapse;margin:8pt 0 10pt;font-size:10.5pt}` +
    `.tbl-cifras th,.tbl-cifras td{border:1px solid #000;padding:3pt 6pt}` +
    `.tbl-cifras th{background:#f0f0f0;text-align:left}` +
    `.tbl-reverso{border-collapse:collapse;margin:6pt 0 14pt;font-size:8pt}` +
    `.tbl-reverso th,.tbl-reverso td{border:1px solid #000;padding:3pt;text-align:center;height:20pt}` +
    `.tbl-reverso th{background:#f0f0f0}` +
    `.tbl-cupones{border-collapse:collapse;margin-top:8pt;table-layout:fixed}` +
    `.tbl-cupones td{border:1px dashed #000;padding:6pt;font-size:8pt;width:33%}` +
    `.cnum{font-weight:bold;border-bottom:1px solid #000;padding-bottom:3pt;margin-bottom:4pt}` +
    `.corte{border-top:1px dashed #999;margin:20pt 0 12pt;text-align:center;font-size:8pt;color:#777;letter-spacing:1pt}` +
    `.variante{font-size:9pt;color:#444;font-style:italic;border-left:2px solid #999;padding-left:8pt}` +
    `.nota-pie{font-size:9pt;color:#555;font-style:italic}</style>` +
    `</head><body>${cuerpo}</body></html>`;

  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = PLANTILLAS[actual].nombre.replace(/ /g,'-').toLowerCase() + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

initSelector();
